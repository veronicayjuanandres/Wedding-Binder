<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Wedding binder · Verónica &amp; Juan Andrés</title>
<style>
:root{
  --bg:#1c0a11;--surface:#2a1019;--surface2:#341522;--line:#4a2230;--ink:#f4ece1;--muted:#c2aaa4;
  --chartreuse:#b9c94b;--champagne:#cdb68a;--ice:#a9bee0;--orange:#e07a2e;--orange-d:#c95f12;--red:#e5757f;
  --display:'Bodoni Moda','Didot','Times New Roman',serif;
  --body:'Figtree','Helvetica Neue',Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding:0 20px 90px;overflow-x:hidden}
[hidden]{display:none!important}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:1180px;margin-inline:auto}
:focus-visible{outline:2px solid var(--chartreuse);outline-offset:3px}

/* tabs del binder */
.tabs{position:sticky;top:0;z-index:30;margin:0 -20px;padding:10px 20px 0;background:rgba(28,10,17,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabs-in{max-width:1180px;margin-inline:auto;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs-in::-webkit-scrollbar{display:none}
.tab{flex:none;appearance:none;background:none;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;padding:9px 16px 10px;font-size:14px;color:var(--muted);cursor:pointer;text-decoration:none;white-space:nowrap;position:relative;bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);background:var(--bg);border-color:var(--line);font-weight:600}
.tab.on::after{content:"";position:absolute;left:12px;right:12px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--orange)}
.tab small{margin-left:6px;font-size:11px;color:var(--bg);background:var(--champagne);padding:1px 6px;border-radius:999px;font-weight:700}
.tab small.warn{background:var(--red)}

/* avisos */
.banner{margin:14px 0 0;padding:10px 14px;border-radius:6px;font-size:14px;border:1px solid var(--line);background:var(--surface)}
.banner.demo{border-color:var(--orange);background:rgba(224,122,46,.1)}
.banner.err{border-color:var(--red);background:rgba(229,117,127,.08)}
.banner b{font-weight:600}

h1,h2,h3{font-family:var(--display);font-weight:400;margin:0}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--champagne);margin:0 0 16px}
h1{font-size:clamp(34px,6vw,64px);line-height:1;letter-spacing:-.01em}
h1 .amp{font-style:italic;color:#e07a2e;padding-inline:.06em}
h2{font-size:clamp(28px,4vw,40px);line-height:1.1;margin-bottom:6px}
.sub{color:var(--muted);margin:0 0 26px;max-width:66ch}
.h3i{font-family:var(--display);font-style:italic;font-size:24px;color:var(--champagne);margin:40px 0 12px}
.cap{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.view{padding-top:44px}

/* hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:28px 40px;align-items:end;padding-bottom:26px;border-bottom:1px solid var(--line)}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
.count{text-align:right}
@media(max-width:760px){.count{text-align:left}}
.count b{display:block;font-family:var(--display);font-size:clamp(54px,9vw,96px);line-height:.95;color:var(--orange);font-weight:400}
.count span{color:var(--muted);font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.sky{display:block;width:100%;max-width:900px;height:auto;margin:34px auto 0;opacity:.9}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:30px 0 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 18px 16px;min-width:0}
.kpi .l{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--display);font-size:clamp(28px,3.4vw,38px);line-height:1.15;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:13px;color:var(--muted);margin-top:2px}
.kpi.good .v{color:var(--chartreuse)}.kpi.bad .v{color:var(--red)}.kpi.acc .v{color:var(--orange)}

/* medidor */
.meter{margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px}
.meter h3{font-size:22px;margin-bottom:14px}
.bar{position:relative;height:30px;border-radius:15px;background:var(--bg);border:1px solid var(--line);overflow:visible;display:flex}
.bar i{display:block;height:100%;min-width:0}
.bar i:first-child{border-radius:15px 0 0 15px}
.bar i:last-of-type{border-radius:0 15px 15px 0}
.bar .mark{position:absolute;top:-8px;bottom:-8px;width:2px;background:var(--ink)}
.bar .mark span{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;color:var(--ink)}
.leg{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:22px;font-size:14px}
.leg span{display:inline-flex;align-items:center;gap:8px;color:var(--muted)}
.leg b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;flex:none}
.c-paid{background:var(--orange)}.c-due{background:var(--champagne)}.c-todo{background:#6d5560}

/* donas */
.donuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px;min-width:0}
.dcard h3{font-size:22px;margin-bottom:2px}
.dcard .note{margin:0 0 12px}
.dwrap{display:flex;flex-wrap:wrap;gap:16px 22px;align-items:center}
.dsvg{flex:0 0 200px;width:200px;height:200px}
.dsvg circle.seg{transition:opacity .15s,stroke-width .15s;cursor:pointer}
.dsvg.hov circle.seg{opacity:.28}.dsvg.hov circle.seg.act{opacity:1;stroke-width:34}
.dc1{font-family:var(--display);font-size:22px;fill:var(--ink);text-anchor:middle}
.dc2{font-size:9.5px;fill:var(--muted);text-anchor:middle;letter-spacing:.08em;text-transform:uppercase}
.dleg{flex:1 1 230px;min-width:0;list-style:none;margin:0;padding:0;font-size:13.5px}
.dleg li{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:4px;cursor:default}
.dleg li:hover,.dleg li.act{background:var(--surface2)}
.dleg .n{flex:1;min-width:0;line-height:1.25}
.dleg .a{color:var(--muted);font-variant-numeric:tabular-nums}
.dleg .p{width:38px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.empty{color:var(--muted);padding:18px 0;font-size:14px}

/* categorías */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;align-items:start}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:0}
.cat>summary{list-style:none;cursor:pointer;padding:16px 18px;display:block}
.cat>summary::-webkit-details-marker{display:none}
.cat[open]{border-color:var(--champagne)}
.cat-h{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.cat-h b{font-size:16px;font-weight:600;display:flex;align-items:center;gap:9px;min-width:0}
.cat-h .amt{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.cbar{height:8px;border-radius:4px;background:var(--bg);margin:12px 0 8px;overflow:hidden;display:flex}
.cbar i{display:block;height:100%}
.cat-f{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.lines{border-top:1px solid var(--line);padding:6px 18px 12px}
.ln{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.ln:last-child{border-bottom:0}
.ln .t{font-weight:600}
.ln .s{color:var(--muted);font-size:13px}
.ln .m{text-align:right;font-variant-numeric:tabular-nums}
.ln .m small{display:block;color:var(--muted);font-size:12px}
.ln.gone{opacity:.45;text-decoration:line-through}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;background:#3a2530;color:var(--ink);white-space:nowrap}
.chip.s-Por-cotizar,.chip.s-Buscando,.chip.s-Recibida,.chip.s-Pendiente{background:#3a2d34;color:var(--muted)}
.chip.s-Cotizado,.chip.s-Cotizando,.chip.s-Negociando,.chip.s-En-proceso{background:rgba(205,182,138,.2);color:var(--champagne)}
.chip.s-Contratado{background:rgba(169,190,224,.2);color:var(--ice)}
.chip.s-Pagado-parcial{background:rgba(224,122,46,.2);color:#f0a468}
.chip.s-Pagado-completo,.chip.s-Aceptada,.chip.s-Hecho{background:rgba(185,201,75,.2);color:var(--chartreuse)}
.chip.s-Descartado,.chip.s-Rechazada{background:#3a2530;color:#9a7b84;text-decoration:line-through}
.chip.s-Por-confirmar{background:rgba(224,122,46,.22);color:#f0a468}
.chip.warn{background:rgba(229,117,127,.18);color:var(--red)}

/* próximos pagos */
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px;min-width:0}
.box h3{font-size:22px;margin-bottom:10px}
.pay{display:flex;gap:14px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.pay:first-of-type{border-top:0}
.date{flex:none;width:52px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:4px 0;background:var(--bg)}
.date b{display:block;font-family:var(--display);font-size:22px;line-height:1.1;font-weight:400}
.date span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--champagne)}
.date.late{border-color:var(--red)}.date.late span{color:var(--red)}
.pay .w{flex:1;min-width:0}.pay .w b{display:block;font-weight:600;font-size:15px}
.pay .w span{color:var(--muted);font-size:13px}
.pay .amt{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.alert{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.alert:first-of-type{border-top:0}
.alert i{flex:none;color:var(--red);font-style:normal}

/* tareas */
.tstats{display:flex;flex-wrap:wrap;gap:18px 30px;align-items:center;margin-bottom:22px}
.ring{width:96px;height:96px;flex:none}
.ring text{font-family:var(--display);font-size:22px;fill:var(--ink);text-anchor:middle}
.filters{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin:0 0 6px}
.filters button{background:none;border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:14px;cursor:pointer}
.filters button:hover{border-color:var(--champagne)}
.filters button.on{border-color:var(--orange);background:rgba(224,122,46,.12)}
.filters button b{color:var(--muted);font-weight:600;margin-left:5px;font-variant-numeric:tabular-nums}
.tg h3{font-family:var(--display);font-style:italic;font-size:24px;color:var(--champagne);margin:34px 0 8px}
.tg h3 small{font-family:var(--body);font-style:normal;font-size:13px;color:var(--muted);margin-left:8px}
.tk{display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}
.tk .ck{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--bg)}
.tk.done .ck{background:var(--chartreuse);border-color:var(--chartreuse)}
.tk.prog .ck{border-color:var(--champagne);background:linear-gradient(90deg,var(--champagne) 50%,transparent 50%)}
.tk.conf .ck{border-color:var(--orange)}
.tk .w{flex:1;min-width:0}
.tk .w b{font-weight:600}
.tk.done .w b{color:var(--muted);text-decoration:line-through;font-weight:400}
.tk .meta{font-size:13px;color:var(--muted)}
.tk .meta .late{color:var(--red);font-weight:600}
.tk .meta .hi{color:var(--orange);font-weight:600}
.tk .nt{font-size:13px;color:var(--muted);font-style:italic}

.proj{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;align-items:start;margin-top:18px}
.pj{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px 8px;min-width:0}
.pj-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pj-h h3{font-size:23px}
.pj-h span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pj .cbar{margin:10px 0 4px}
.pj .tk:first-of-type{border-top:0}
.vc .sv:empty{display:none}
.stsel{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:3px 8px;cursor:pointer;max-width:150px}
.stsel option{background:#2a1019;color:#f4ece1}
.tk .ck.tgl{cursor:pointer}
.tk .ck.tgl:hover{border-color:var(--chartreuse)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--champagne);padding:10px 18px;border-radius:999px;z-index:70;font-size:14px;max-width:90vw}
.toast.err{border-color:var(--red)}
.edit-on{color:var(--chartreuse)}
/* proveedores / cotizaciones / planner */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.vc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.vc .sv{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--champagne)}
.vc h3{font-size:23px;line-height:1.15}
.vc h3.tbd{color:var(--muted);font-style:italic}
.vc .row{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.vc .row b{color:var(--ink);font-weight:600}
.vc .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.vc .links a{font-size:13px;color:var(--chartreuse);text-underline-offset:3px}
.vc.off{opacity:.5}
.vc .nt{font-size:13px;color:var(--muted);font-style:italic}
.qg{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:14px}
.qg h3{font-size:22px;margin-bottom:6px}
.q{display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding:11px 0;border-top:1px solid var(--line)}
.q .w b{font-weight:600}.q .w span{display:block;font-size:13px;color:var(--muted)}
.q .m{text-align:right;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.q .m small{display:block;font-family:var(--body);font-size:12px;color:var(--chartreuse)}
.q.rej{opacity:.5}
.ana{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px 28px}
.ana div span{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--champagne)}
.ana div p{margin:2px 0 0;white-space:pre-wrap}
.mt{border-left:2px solid var(--line);margin:10px 0 0 6px;padding-left:22px}
.mt .m{position:relative;padding:0 0 26px}
.mt .m::before{content:"";position:absolute;left:-29px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--orange);border:2px solid var(--bg)}
.mt .m .d{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--champagne)}
.mt .m h4{margin:2px 0 4px;font-size:17px}
.mt .m p{margin:2px 0;color:var(--muted);font-size:14.5px;white-space:pre-wrap}
.mt .m p b{color:var(--ink);font-weight:600}
.mood{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:26px}
.btn{display:inline-block;margin:6px 10px 0 0;padding:10px 18px;border-radius:999px;border:1px solid var(--champagne);background:none;text-decoration:none;cursor:pointer;font-size:15px}
.btn.pri{background:var(--orange);border-color:var(--orange);color:#1c0a11;font-weight:600}
.btn:hover{filter:brightness(1.1)}
iframe.mb{display:block;width:100%;height:82vh;min-height:480px;border:1px solid var(--line);border-radius:8px;margin-top:20px;background:var(--bg)}

footer{margin-top:60px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
footer button{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 14px;cursor:pointer;font-size:13px}
footer button:hover{border-color:var(--champagne)}
@media print{.tabs,footer button{display:none}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div class="tabs"><div class="tabs-in" id="tabs" role="tablist"></div></div>
<div class="wrap">
  <div id="banner"></div>
  <main id="main"></main>
  <footer><span id="stamp"></span><button type="button" id="refresh">↻ Actualizar</button><button type="button" id="edit-btn" hidden></button><span>Se actualiza sola cada minuto desde la hoja de Google. Los cambios se hacen allá.</span></footer>
</div>

<script>
/* ============ CONFIGURACIÓN ============ */
/* Pega aquí el ID de tu Google Sheet (lo que va entre /d/ y /edit en su enlace).
   Si lo dejas vacío, la página muestra datos de EJEMPLO. También funciona ?sheet=ID al final del enlace. */
var SHEET_ID = "188MkcOCiRcXXspK2rfyQQi0t42s1ga6zp1anQcgj-r8";
/* URL de la aplicación web de Google (Apps Script) que permite cambiar estados desde esta página. Vacía = solo lectura. */

/* ---------- utilidades ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function money(n){n=Math.round(n||0);return (n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US')}
function pct(n){return Math.round(n*100)+'%'}
function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function dd(d){return Math.round((d-today())/864e5)}
function fdate(d){return d.getDate()+' '+MESES[d.getMonth()]+' '+d.getFullYear()}
function rel(d){var n=dd(d);return n===0?'hoy':n===1?'mañana':n===-1?'ayer':n>0?'en '+n+' días':'hace '+(-n)+' días'}
function num(v){return typeof v==='number'?v:(typeof v==='string'&&v.trim()!==''&&!isNaN(+v)?+v:0)}
function str(v){return v==null?'':(v instanceof Date?fdate(v):String(v)).trim()}
function dt(v){return v instanceof Date?v:null}
function url(u){u=str(u);return /^https?:\/\//i.test(u)?u:''}
function chip(s,extra){s=str(s);return s?'<span class="chip s-'+esc(s.replace(/\s+/g,'-'))+(extra?' '+extra:'')+'">'+esc(s)+'</span>':''}
function isoDate(v){if(v instanceof Date)return v;var m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(str(v));return m?new Date(+m[1],+m[2]-1,+m[3]):null}
function plural(n,a,b){return n===1?a:b}

/* ---------- lectura de Google Sheets (gviz por <script>, sin CORS) ---------- */
var cbN=0;
function cellVal(c,col){
  var v=c.v;
  /* Google a veces manda las fechas como número de serie con formato de fecha */
  if(typeof v==='number'&&col&&col.pattern&&/yy|d{1,2}[\/.-]m/i.test(col.pattern))return new Date(1899,11,30+Math.floor(v));
  if(typeof v==='string'&&v.indexOf('Date(')===0){
    var p=v.slice(5,-1).split(',').map(Number);return new Date(p[0],p[1],p[2]);
  }
  return v;
}
function gviz(sheet,range){
  return new Promise(function(res,rej){
    var name='__gv'+(++cbN)+'_'+Date.now(),s=document.createElement('script'),done=false;
    function end(){done=true;clearTimeout(t);try{delete window[name]}catch(e){window[name]=undefined}s.remove()}
    var t=setTimeout(function(){if(!done){end();rej(new Error('tiempo'))}},14000);
    window[name]=function(r){
      if(done)return;end();
      if(!r||r.status==='error'||!r.table){rej(new Error('acceso'));return}
      var cols=r.table.cols;res(r.table.rows.map(function(row){return row.c.map(function(c,j){return c?cellVal(c,cols[j]):null})}));
    };
    s.onerror=function(){if(!done){end();rej(new Error('red'))}};
    s.src='https://docs.google.com/spreadsheets/d/'+encodeURIComponent(SHEET_ID)+'/gviz/tq?tqx=out:json;responseHandler:'+name+
      '&sheet='+encodeURIComponent(sheet)+'&range='+encodeURIComponent(range)+'&headers=0';
    document.head.appendChild(s);
  });
}
function loadSheet(){
  var jobs={fecha:['Resumen','C5:C5'],total:['Resumen','C6:C6'],inv:['Resumen','C7:C7'],pres:['Presupuesto','A7:N206'],tareas:['Tareas','A6:I205'],prov:['Proveedores','A5:G104'],
    cot:['Cotizaciones','A5:J204'],ana:['Wedding planner','B5:C13'],reu:['Wedding planner','B18:F67']};
  var keys=Object.keys(jobs);
  jobs.beb=['Bebidas','A5:G60'];keys.push('beb');
  return Promise.all(keys.map(function(k){var q=gviz(jobs[k][0],jobs[k][1]);return k==='beb'?q.catch(function(){return []}):q})).then(function(out){
    var raw={};keys.forEach(function(k,i){raw[k]=out[i]});return raw;
  });
}

    o.vig=o.estado==='Descartado'?0:(o.fin>0?o.fin:(o.cot>0?o.cot:o.est));
    o.pend=o.estado==='Descartado'?0:Math.max(o.vig-o.pag,0);

    return {row:r.__row,serv:str(r[0])||'Sin servicio',prov:str(r[1]),fecha:dt(r[2]),monto:num(r[3]),incluye:str(r[4]),hasta:dt(r[5]),estado:str(r[6])||'Recibida',link:url(r[7]),nota:str(r[8]),alerta:str(r[9])};
  });

/* ---------- gráficos SVG ---------- */
function donut(id,items,centerBig,centerSmall){
  var tot=items.reduce(function(a,i){return a+i.v},0),R=70,C=2*Math.PI*R,svg='';
  if(tot<=0){
    svg='<circle cx="100" cy="100" r="'+R+'" fill="none" stroke="#3a2530" stroke-width="28"/><text class="dc2" x="100" y="104">Aún sin montos</text>';
    return '<div class="dwrap"><svg class="dsvg" viewBox="0 0 200 200">'+svg+'</svg><div class="empty">Cuando anotes montos en la hoja, aparecen aquí.</div></div>';
  }
  var off=0;
  items.forEach(function(it,i){
    if(it.v<=0)return;
    var len=it.v/tot*C,gap=Math.min(2,len*.2);
    svg+='<circle class="seg" data-d="'+id+'" data-i="'+i+'" cx="100" cy="100" r="'+R+'" fill="none" stroke="'+it.color+'" stroke-width="28" stroke-dasharray="'+Math.max(len-gap,.1)+' '+(C-Math.max(len-gap,.1))+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 100 100)"><title>'+esc(it.name)+': '+money(it.v)+'</title></circle>';
    off+=len;
  });
  svg+='<text class="dc1" id="'+id+'-b" x="100" y="102">'+esc(centerBig)+'</text><text class="dc2" id="'+id+'-s" x="100" y="120">'+esc(centerSmall)+'</text>';
  var leg=items.map(function(it,i){
    if(it.v<=0)return '';
    return '<li data-d="'+id+'" data-i="'+i+'"><span class="dot" style="background:'+it.color+'"></span><span class="n">'+esc(it.name)+'</span><span class="a">'+money(it.v)+'</span><span class="p">'+pct(it.v/tot)+'</span></li>';
  }).join('');
  return '<div class="dwrap" data-donut="'+id+'"><svg class="dsvg" id="'+id+'" viewBox="0 0 200 200" role="img" aria-label="Gráfico de dona">'+svg+'</svg><ul class="dleg">'+leg+'</ul></div>';
}
var DONUTS={};
function wireDonuts(){
  $$('[data-donut]').forEach(function(w){
    var id=w.getAttribute('data-donut'),D=DONUTS[id],svg=$('#'+id),b=$('#'+id+'-b'),s=$('#'+id+'-s');
    function on(i){
      svg.classList.add('hov');
      $$('circle.seg',svg).forEach(function(c){c.classList.toggle('act',c.getAttribute('data-i')==i)});
      $$('li',w).forEach(function(l){l.classList.toggle('act',l.getAttribute('data-i')==i)});
      var it=D.items[i];b.textContent=money(it.v);s.textContent=it.name.length>20?it.name.slice(0,19)+'…':it.name;
    }
    function off(){svg.classList.remove('hov');$$('.act',w).forEach(function(e){e.classList.remove('act')});b.textContent=D.big;s.textContent=D.small}
    $$('[data-i]',w).forEach(function(e){
      e.addEventListener('mouseenter',function(){on(e.getAttribute('data-i'))});
      e.addEventListener('mouseleave',off);
      e.addEventListener('click',function(){on(e.getAttribute('data-i'))});
    });
  });
}
function ring(p){
  var R=40,C=2*Math.PI*R;
  return '<svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="'+R+'" fill="none" stroke="#3a2530" stroke-width="10"/><circle cx="50" cy="50" r="'+R+'" fill="none" stroke="#b9c94b" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+(C*p)+' '+C+'" transform="rotate(-90 50 50)"/><text x="50" y="57">'+pct(p)+'</text></svg>';
}

  if(e==='codigo'){EDIT=false;try{localStorage.removeItem('binder-code')}catch(x){}CODE='';editBtn();render();return 'Código incorrecto. Vuelve a activar la edición.'}

    var o=OV[k];if(now-o.t>120000){delete OV[k];return}
    var m=MAP[o.h],arr=raw[m.k];if(arr&&arr[o.r-m.f])arr[o.r-m.f][m.c]=o.v;

    if(!d||!d.ok)throw new Error(d&&d.error||'error');
    OV[hoja+'|'+row]={h:hoja,r:row,v:val,t:Date.now()};
    var m=MAP[hoja];if(RAW&&RAW[m.k]&&RAW[m.k][row-m.f])RAW[m.k][row-m.f][m.c]=val;

var lastLoad=0,lastRaw='';
function stamp(d,extra){$('#stamp').textContent='Actualizado: '+d.toLocaleString('es',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+(extra||'')}
function banner(kind,html){$('#banner').innerHTML=html?'<div class="banner '+kind+'">'+html+'</div>':''}
function reviveRaw(raw){
  /* las fechas se guardan como texto en el caché; se vuelven a convertir */
  return JSON.parse(JSON.stringify(raw),function(k,v){return (typeof v==='string'&&/^__D:/.test(v))?new Date(+v.slice(4)):v});
}
function saveCache(raw){
  try{localStorage.setItem(CACHE_KEY,JSON.stringify({t:Date.now(),raw:JSON.parse(JSON.stringify(raw,function(k,v){return this[k] instanceof Date?'__D:'+this[k].getTime():v}))}))}catch(e){}
}
function readCache(){
  try{var c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');if(c)return {t:new Date(c.t),raw:reviveRaw(c.raw)}}catch(e){}return null;
}
function load(silent){
  if(silent===true&&document.hidden)return;
  lastLoad=Date.now();
  if(DEMO){
    M=model(demoRaw());stamp(new Date(),' · datos de ejemplo');
    banner('demo','<b>Modo demostración.</b> Estos números y nombres son inventados, solo para ver el diseño. Para conectar tu hoja real, pega su ID en <code>SHEET_ID</code> al inicio del archivo (instrucciones en el mensaje).');
    route();return;
  }
  if(silent!==true)$('#refresh').disabled=true;
  loadSheet().then(function(raw){
    var sig=JSON.stringify(raw,function(k,v){return this[k] instanceof Date?+this[k]:v});
    if(silent===true&&sig===lastRaw){stamp(new Date());return}
    var first=!lastRaw;lastRaw=sig;applyOV(raw);RAW=raw;
    M=model(raw);saveCache(raw);banner('',''); stamp(new Date());
    if(first||silent!==true)route();else render();
  }).catch(function(e){
    if(silent===true&&M)return;
    var c=readCache();
    var why=e&&e.message==='acceso'?'La hoja no deja leerla. Revisa que esté compartida como «Cualquier persona con el enlace: Lector».':
      'No se pudo conectar con Google ahora mismo.';
    if(c){M=model(c.raw);stamp(c.t,' · última copia guardada');banner('err','<b>Sin conexión con la hoja.</b> '+why+' Estás viendo la última copia guardada en este dispositivo.');route()}
    else{M=null;banner('err','<b>No se pudo cargar la hoja.</b> '+why);renderTabs();$('#main').innerHTML='<section class="view"><p class="empty">Intenta de nuevo con «Actualizar».</p></section>'}
  }).then(function(){$('#refresh').disabled=false});
}
$('#refresh').onclick=function(){load()};
$('#edit-btn').onclick=function(){

  post({action:'check'},c.trim()).then(function(d){

    CODE=c.trim();try{localStorage.setItem('binder-code',CODE)}catch(e){}

  }).catch(function(e){toast(e&&e.message==='codigo'?'Código incorrecto.':'No se pudo conectar con la hoja.',true)});
